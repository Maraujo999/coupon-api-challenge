name: Verify Coupon API

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, integration, architecture, formatting and coverage
        run: ./mvnw -B -ntp clean verify
      - name: Run packaged JAR and inspect operational logs
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/verify_runtime.py
      - name: Verify domain and use case mutation strength
        run: ./mvnw -B -ntp -Pmutation org.pitest:pitest-maven:mutationCoverage
      - name: Publish test and runtime reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
            target/pit-reports/
            tmp/runtime/result.json
          retention-days: 7

  container:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: coupon-api-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure disposable demo credentials
        run: python3 scripts/demo.py configure
      - name: Build and start the container
        run: docker compose up --build --wait --wait-timeout 180
      - name: Exercise API inside the container
        run: python3 scripts/demo.py smoke
      - name: Inspect container logs
        run: |
          mkdir -p tmp
          docker compose logs --no-color > tmp/container.log
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.check_logs import check
          for line in Path('.env').read_text().splitlines():
              if line and not line.startswith('#'):
                  key, value = line.split('=', 1)
                  os.environ[key] = value
          check('tmp/container.log')
          PY
      - name: Stop this test deployment
        if: always()
        run: docker compose down --remove-orphans
